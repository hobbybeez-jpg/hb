<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 Arial, "Noto Sans TC", sans-serif; margin: 0; color: #202124; }
  .wrap { display: flex; height: 100vh; }
  .side { width: 250px; border-right: 1px solid #dadce0; overflow-y: auto; padding: 10px; box-sizing: border-box; flex-shrink: 0; }
  .main { flex: 1; overflow-y: auto; padding: 12px 16px 80px; box-sizing: border-box; }
  .bar { display: flex; gap: 6px; margin-bottom: 10px; }
  input[type=text] { flex: 1; padding: 6px 8px; font-size: 14px; border: 1px solid #c4c7c5; border-radius: 4px; text-transform: uppercase; }
  button { padding: 6px 12px; border: 1px solid #c4c7c5; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .recent div { padding: 5px 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .recent div:hover { background: #f1f3f4; }
  .recent .meta { color: #5f6368; font-size: 11px; }
  .done { color: #188038; font-size: 11px; white-space: nowrap; }
  h3 { margin: 16px 0 6px; font-size: 14px; }
  table { border-collapse: collapse; width: 100%; margin: 4px 0 8px; }
  th, td { border: 1px solid #e0e0e0; padding: 3px 6px; text-align: left; vertical-align: top; font-size: 12px; }
  th { background: #f8f9fa; font-weight: normal; color: #5f6368; white-space: nowrap; }
  .msg { padding: 6px 10px; border-radius: 4px; margin: 4px 0; white-space: pre-wrap; }
  .err { background: #fce8e6; color: #a50e0e; }
  .warn { background: #fef7e0; color: #7a4f01; }
  .note { background: #f1f3f4; color: #3c4043; }
  .ok { background: #e6f4ea; color: #0d652d; }
  .card { border: 1px solid #dadce0; border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
  .card .title { font-weight: bold; }
  .card .where { color: #5f6368; font-size: 12px; }
  .skip { opacity: .6; }
  .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #999; vertical-align: middle; margin-left: 4px; }
  .footer { position: fixed; bottom: 0; left: 250px; right: 0; background: #fff; border-top: 1px solid #dadce0; padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  .muted { color: #5f6368; }
  .kind { font-size: 11px; padding: 1px 5px; border-radius: 3px; background: #e8f0fe; color: #174ea6; }
  .box { border: 1px solid #dadce0; border-radius: 6px; padding: 8px; margin-bottom: 10px; }
  .box label { display: block; margin: 6px 0; font-size: 12px; color: #5f6368; }
  .box input[type=date] { width: 100%; box-sizing: border-box; padding: 4px; font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
  .badge.ok { background: #e6f4ea; color: #0d652d; }
  .badge.warn { background: #fef7e0; color: #7a4f01; }
  .badge.err { background: #fce8e6; color: #a50e0e; }
  .badge.note { background: #f1f3f4; color: #5f6368; }
  .linkbtn { padding: 2px 8px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="side">
    <div class="box">
      <b>找未登記的訂單</b>
      <label>從 <input type="date" id="from"></label>
      <label>到 <input type="date" id="to"></label>
      <button class="primary" onclick="scan()" style="width:100%">掃描</button>
    </div>
    <button onclick="loadRecent()" style="width:100%">最近 25 張訂單</button>
    <div id="recent" class="recent" style="margin-top:8px"></div>
  </div>
  <div class="main">
    <div class="bar">
      <input type="text" id="name" placeholder="單號，例如 CA53126D" onkeydown="if(event.key==='Enter')preview()">
      <button class="primary" onclick="preview()">預覽</button>
    </div>
    <div id="out" class="muted">輸入單號後按「預覽」，確認內容沒問題再按「寫入」。預覽不會改任何試算表。</div>
  </div>
</div>
<div class="footer">
  <label id="ackWrap" style="display:none"><input type="checkbox" id="ack" onchange="updateWrite()"> 我已確認上面的警告</label>
  <button class="primary" id="writeBtn" disabled onclick="submitWrite()">寫入</button>
  <button class="primary" id="batchBtn" disabled style="display:none" onclick="submitBatch()">寫入勾選的單</button>
  <span id="status" class="muted"></span>
</div>
<script>
var current = null;
var batch = null;
var STATUS = {
  ready: ['可寫入', 'ok'], warn: ['需確認', 'warn'], error: ['錯誤', 'err'], partial: ['部分已登記', 'err'],
  done: ['已登記', 'note'], nothing: ['不用記錄', 'note'], skip: ['略過', 'note'], written: ['已寫入', 'ok'], failed: ['寫入失敗', 'err']
};
var KIND = { stock: '現貨', preorder: '預購', backorder: 'backorder', service: '服務費/運費', skip: '不記錄', popw: 'POPW 出貨', removed: '已移除' };
var OPS = {
  appendShipped: '新增一列', appendPreorder: '新增一列', appendPW: '新增一列', ensureOrdering: '新增一列（UPC 不存在時）',
  updatePreorder: '修改', updateShipped: '修改'
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function money(n) { return n === '' || n == null ? '' : (typeof n === 'number' ? n.toFixed(2) : esc(n)); }
function setStatus(t) { document.getElementById('status').textContent = t || ''; }

function loadRecent() {
  var box = document.getElementById('recent');
  box.innerHTML = '<span class="muted">讀取中…</span>';
  google.script.run.withSuccessHandler(function (list) {
    box.innerHTML = list.map(function (o) {
      return '<div onclick="pick(\'' + esc(o.name) + '\')"><span>' + esc(o.name) +
        '<br><span class="meta">' + esc(o.createdAt.slice(5, 16).replace('T', ' ')) + ' ' + esc(o.source) + (o.cancelled ? ' 已取消' : '') + ' ' + esc(o.status) + '</span></span>' +
        (o.done ? '<span class="done">已寫入</span>' : '') + '</div>';
    }).join('');
  }).withFailureHandler(function (e) { box.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; }).apiRecent();
}

function pick(name) { document.getElementById('name').value = name; preview(); }

function preview() {
  var name = document.getElementById('name').value.trim();
  if (!name) return;
  current = null; setMode('single'); updateWrite();
  document.getElementById('out').innerHTML = '<span class="muted">讀取 ' + esc(name) + '…</span>';
  setStatus('');
  google.script.run.withSuccessHandler(render).withFailureHandler(function (e) {
    document.getElementById('out').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>';
  }).apiPreview(name);
}

function render(res) {
  current = res;
  var o = res.order, p = res.plan, h = [];
  setMode('single');
  if (batch) h.push('<a href="#" onclick="backToBatch();return false;">← 回到批次清單</a>');
  h.push('<h3>' + esc(o.name) + '　' + esc(o.date) + '　<span class="muted">' + esc(o.source) + '・' + esc(o.status) +
    '・' + esc(o.shippingTitle || '沒有運送方式') + (o.country ? '・' + esc(o.country) : '') + '・運費 $' + money(o.shippingCharged) + '</span></h3>');
  h.push('<div class="muted">判斷：' + esc(p.summary) + '</div>');
  h.push('<table><tr><th>Shopify 商品</th><th>判斷</th><th>數量</th><th>單價</th><th>折扣</th><th>SKU / Barcode</th></tr>');
  o.lines.forEach(function (l) {
    h.push('<tr><td>' + esc(l.name).replace(/\t/g, ' ⇥ ') + '</td><td><span class="kind">' + esc(KIND[l.kind] || l.kind) + '</span></td><td>' + esc(l.qty) +
      '</td><td>' + money(l.unitPrice) + '</td><td>' + money(l.discount) + '</td><td>' + esc(l.sku) + (l.barcode && l.barcode !== l.sku ? ' / ' + esc(l.barcode) : '') + '</td></tr>');
  });
  h.push('</table>');
  h.push('<table><tr><th>付款</th><th>金額</th><th>手續費</th><th>來源</th></tr>');
  (o.payments || []).forEach(function (pay) {
    h.push('<tr><td>' + esc(pay.gateway) + ' ' + esc(String(pay.createdAt).slice(0, 16).replace('T', ' ')) + '</td><td>' + money(pay.amount) +
      '</td><td>' + (pay.fee == null ? '<b>讀不到</b>' : money(pay.fee)) + '</td><td class="muted">' + esc(pay.feeNote) + '</td></tr>');
  });
  if (!(o.payments || []).length) h.push('<tr><td colspan="4" class="muted">沒有付款紀錄</td></tr>');
  h.push('</table>');

  p.errors.forEach(function (m) { h.push('<div class="msg err">✕ ' + esc(m) + '</div>'); });
  p.warnings.forEach(function (m) { h.push('<div class="msg warn">! ' + esc(m) + '</div>'); });
  p.notes.forEach(function (m) { h.push('<div class="msg note">' + esc(m) + '</div>'); });

  h.push('<h3>會寫入的內容</h3>');
  if (!p.actions.length) h.push('<div class="muted">沒有</div>');
  p.actions.forEach(function (a) {
    var where = a.target ? esc(a.target.tab) + ' 第 ' + a.target.row + ' 列' : '（無法決定位置）';
    h.push('<div class="card' + (a.skip ? ' skip' : '') + '"><div class="title">' + esc(a.label) + '　' + esc(a.key) + '</div>');
    h.push('<div class="where">' + esc(OPS[a.op] || a.op) + '：' + where + (a.skip ? '　— ' + esc(a.skipReason) : '') + '</div>');
    var vals = a.values || a.set;
    if (a.op === 'updatePreorder') {
      vals = { B: 'Y', N: (a.addPaid ? '原本 ' + money(a.paidBefore) + ' ＋ ' + money(a.addPaid) + ' ＝ ' + money(a.paidAfter) : '不變（' + money(a.paidBefore) + '）') };
      h.push('<div>應付 $' + money(a.due) + '，已付 $' + money(a.paidAfter) + '，差 $' + money(a.diff) +
        '　整列標 <span class="sw" style="background:' + esc(a.rowColor) + '"></span> ' + (a.diff === 0 ? '綠色' : '橘色＋寄信') + '</div>');
    }
    if (vals) {
      var cols = Object.keys(vals);
      h.push('<table><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr><tr>' + cols.map(function (c) {
        var color = a.colors && a.colors[c];
        var v = vals[c];
        return '<td>' + (typeof v === 'number' ? (Number.isInteger(v) && /^[ILJ]$/.test(c) ? v : money(v)) : esc(v)) + (color ? '<span class="sw" style="background:' + esc(color) + '"></span>' : '') + '</td>';
      }).join('') + '</tr></table>');
    }
    if (a.op === 'appendPreorder') h.push('<div class="muted">J、K 欄複製上一列的公式；O 欄：' + (a.deposit ? '=M×L−N' : '---') + '；D:H 合併</div>');
    if (a.op === 'appendShipped') h.push('<div class="muted">D:G 合併；H 欄 Supplier 留空（人工填）</div>');
    if (a.op === 'appendPW') h.push('<div class="muted">H、L、M、P、Q 欄複製上一列的公式</div>');
    h.push('</div>');
  });
  document.getElementById('out').innerHTML = h.join('');
  document.getElementById('ack').checked = false;
  document.getElementById('ackWrap').style.display = p.warnings.length ? '' : 'none';
  updateWrite();
}

function updateWrite() {
  var btn = document.getElementById('writeBtn');
  if (!current) { btn.disabled = true; return; }
  var p = current.plan;
  var writable = p.actions.some(function (a) { return !a.skip; });
  btn.disabled = !!p.errors.length || !writable || (p.warnings.length && !document.getElementById('ack').checked);
}

// 不能叫 write()：onclick 裡的 write() 會變成 document.write()，把整個視窗清空
function submitWrite() {
  if (!current) return;
  var name = current.order.name;
  document.getElementById('writeBtn').disabled = true;
  setStatus('寫入中…');
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { setStatus(''); alert(r.message); if (r.changed) preview(); else updateWrite(); return; }
    current = null; updateWrite();
    setStatus('');
    markBatch(name, { ok: true, written: r.written, emailed: r.emailed });
    var h = [(batch ? '<a href="#" onclick="backToBatch();return false;">← 回到批次清單</a>' : '') +
      '<div class="msg ok">' + esc(name) + ' 已寫入' + (r.emailed ? '，並已寄信通知' : '') + '：</div><ul>'];
    r.written.forEach(function (w) { h.push('<li>' + esc(w.label) + ' ' + esc(w.key) + ' → <a href="' + esc(w.url) + '" target="_blank">' + esc(w.tab) + ' 第 ' + w.row + ' 列</a></li>'); });
    h.push('</ul>');
    document.getElementById('out').innerHTML = h.join('');
    document.getElementById('ackWrap').style.display = 'none';
  }).withFailureHandler(function (e) { setStatus(''); alert(e.message); updateWrite(); }).apiWrite(name, current.fingerprint);
}

// ---- 批次 ----

function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

function setMode(m) {
  document.getElementById('writeBtn').style.display = m === 'single' ? '' : 'none';
  document.getElementById('batchBtn').style.display = m === 'batch' ? '' : 'none';
  if (m === 'batch') document.getElementById('ackWrap').style.display = 'none';
}

function scan() {
  var from = document.getElementById('from').value, to = document.getElementById('to').value;
  if (!from || !to) { alert('請選擇日期範圍'); return; }
  batch = { from: from, to: to, items: [], checked: {}, showAll: false, busy: true, total: 0 };
  current = null; updateWrite();
  setMode('batch');
  renderBatch();
  scanNext(0);
}

function scanNext(start) {
  google.script.run.withSuccessHandler(function (r) {
    batch.total = r.total;
    r.items.forEach(function (it) { batch.items.push(it); if (it.status === 'ready') batch.checked[it.name] = true; });
    if (r.next !== null && r.next !== undefined) { renderBatch(); scanNext(r.next); return; }
    batch.busy = false;
    renderBatch();
  }).withFailureHandler(function (e) { batch.busy = false; batch.error = e.message; renderBatch(); }).apiScan(batch.from, batch.to, start);
}

function findItem(name) { return batch && batch.items.filter(function (x) { return x.name === name; })[0]; }

function renderBatch() {
  if (!batch) return;
  var counts = {};
  batch.items.forEach(function (it) { counts[it.status] = (counts[it.status] || 0) + 1; });
  var h = ['<h3>' + esc(batch.from) + ' ～ ' + esc(batch.to) + '　共 ' + batch.total + ' 張訂單' +
    (batch.busy ? '　<span class="muted">掃描中… ' + batch.items.length + ' / ' + (batch.total || '?') + '</span>' : '') + '</h3>'];
  if (batch.error) h.push('<div class="msg err">' + esc(batch.error) + '</div>');
  h.push('<div>' + Object.keys(STATUS).filter(function (k) { return counts[k]; }).map(function (k) {
    return '<span class="badge ' + STATUS[k][1] + '">' + STATUS[k][0] + ' ' + counts[k] + '</span>';
  }).join(' ') + '　<label class="muted"><input type="checkbox" ' + (batch.showAll ? 'checked ' : '') +
    'onchange="toggleShowAll(this)"> 顯示已登記／略過的單</label></div>');
  h.push('<div class="muted" style="margin:6px 0">預設只勾「可寫入」。「需確認」請先按「檢視」看過警告再勾。寫入會照訂單時間先後。</div>');
  h.push('<table><tr><th></th><th>單號</th><th>時間</th><th>判斷</th><th>狀態</th><th>說明</th><th></th></tr>');
  batch.items.forEach(function (it) {
    var hidden = !batch.showAll && /^(done|nothing|skip)$/.test(it.status);
    if (hidden) return;
    var can = it.status === 'ready' || it.status === 'warn';
    var st = STATUS[it.status] || [it.status, 'note'];
    var note = it.status === 'written'
      ? (it.written || []).map(function (w) { return '<a href="' + esc(w.url) + '" target="_blank">' + esc(w.tab) + ' 第 ' + w.row + ' 列</a>'; }).join('、') + (it.emailed ? '（已寄信）' : '')
      : esc(it.note || '');
    h.push('<tr><td>' + (can ? '<input type="checkbox" data-name="' + esc(it.name) + '" ' + (batch.checked[it.name] ? 'checked ' : '') + 'onchange="toggleItem(this)">' : '') +
      '</td><td>' + esc(it.name) + '</td><td>' + esc(String(it.createdAt).slice(5, 16).replace('T', ' ')) + '</td><td>' + esc(it.summary || '') +
      '</td><td><span class="badge ' + st[1] + '">' + st[0] + '</span></td><td>' + note + '</td><td>' +
      (it.preview ? '<button class="linkbtn" onclick="viewItem(\'' + esc(it.name) + '\')">檢視</button>' : '') + '</td></tr>');
  });
  h.push('</table>');
  document.getElementById('out').innerHTML = h.join('');
  updateBatchBtn();
}

function toggleShowAll(el) { batch.showAll = el.checked; renderBatch(); }
function toggleItem(el) { batch.checked[el.getAttribute('data-name')] = el.checked; updateBatchBtn(); }

function checkedItems() {
  return batch ? batch.items.filter(function (it) { return batch.checked[it.name] && (it.status === 'ready' || it.status === 'warn'); }) : [];
}

function updateBatchBtn() {
  var n = checkedItems().length;
  var btn = document.getElementById('batchBtn');
  btn.textContent = '寫入勾選的 ' + n + ' 張';
  btn.disabled = !n || batch.busy || batch.writing;
}

function viewItem(name) {
  var it = findItem(name);
  if (it && it.preview) { current = null; render(it.preview); }
}

function backToBatch() { current = null; updateWrite(); setMode('batch'); renderBatch(); }

function markBatch(name, res) {
  var it = findItem(name);
  if (!it) return;
  it.status = res.ok ? 'written' : 'failed';
  it.note = res.ok ? '' : res.message;
  it.written = res.written || [];
  it.emailed = !!res.emailed;
  batch.checked[name] = false;
}

function submitBatch() {
  var list = checkedItems();
  if (!list.length) return;
  var warned = list.filter(function (it) { return it.status === 'warn'; }).length;
  if (warned && !confirm('勾選的單裡有 ' + warned + ' 張有警告，確定都檢查過了嗎？')) return;
  batch.writing = true;
  updateBatchBtn();
  var payload = list.map(function (it) { return { name: it.name, fingerprint: it.fingerprint }; });
  writeNext(payload, 0);
}

function writeNext(payload, start) {
  setStatus('寫入中… ' + start + ' / ' + payload.length);
  google.script.run.withSuccessHandler(function (r) {
    r.results.forEach(function (res) { markBatch(res.name, res); });
    renderBatch();
    if (r.next !== null && r.next !== undefined) { writeNext(payload, r.next); return; }
    batch.writing = false;
    var ok = batch.items.filter(function (it) { return it.status === 'written'; }).length;
    var bad = r.results.filter(function (x) { return !x.ok; }).length;
    setStatus('完成。' + (bad ? '有 ' + bad + ' 張沒寫入，請看說明欄。' : ''));
    if (r.stopped) alert('有一張單寫到一半出錯，已停止。請看「紀錄」分頁和試算表，必要時手動修正。');
    updateBatchBtn();
  }).withFailureHandler(function (e) {
    batch.writing = false; setStatus(''); alert('寫入失敗：' + e.message); renderBatch();
  }).apiWriteBatch(payload, start);
}

(function () {
  var today = new Date(), from = new Date();
  from.setDate(today.getDate() - 2);
  document.getElementById('from').value = ymd(from);
  document.getElementById('to').value = ymd(today);
})();

loadRecent();
</script>
</body>
</html>
